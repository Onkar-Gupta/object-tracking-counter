source: data/sample.mp4            # file, webcam index (0) or rtsp:// URL
detector:
  name: onnx                       # onnx | mot_file | ultralytics
  model: TBC                       # chosen by the CPU benchmark
  models_dir: models
  confidence: 0.4
  classes: [person]
tracker:
  name: bytetrack
  params: {}
counter:
  line: [[100, 400], [1180, 400]]  # A then B; "in" = positive side to negative side
  anchor: bottom_center            # bottom_center | center
  min_frames_on_far_side: 3        # the N-frame rule; 1 disables it
  margin_px: 4                     # dead band around the line
  max_age_frames: 60               # forget a track unseen this long
  cooldown_frames: 0               # a track cannot emit another event for this many frames (0 = off)
  min_track_frames: 0              # a track must be this old before it can emit an event
  merge_frames: 0                  # drop an event if another one in the same direction was emitted
  merge_px: 0                      # within merge_frames frames and this many pixels along the line (0 = off)
output:
  dir: runs/latest
  save_video: false
  show: false
evaluation:
  mot17_dir: TBC                   # where MOT17 is stored (never committed)
  lines_file: eval/lines.yaml
  min_conf: 0.1                    # detection score floor (the ByteTrack paper's low-score floor)
  tolerance_s: 1.0
  position_tolerance: 0.1          # fraction of line length
  gt_margin_px: 0.5                # ground-truth dead band; removes arbitrary on-the-line ties
